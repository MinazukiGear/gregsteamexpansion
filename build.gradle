plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.38'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'

            // GTCEu and EMI development jars carry production refmaps. All
            // ForgeGradle run types, including data generation, must remap them.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/'),
                    '--existing-mod', 'gtceu'
        }
    }
}

// All our mixins target GTCEu classes with remap = false, so no refmap is
// needed; the config line registers the mixin config for development runs.
mixin {
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com/'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
    maven {
        name = 'Sleeping Town'
        url = 'https://repo.sleeping.town/'
        content {
            includeGroup 'dev.emi'
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

configurations {
    gtceuEmbedded
    jadeApi
}

def embeddedDependencyDir = layout.buildDirectory.dir('embedded-dependencies')
def extractGtceuEmbeddedDependencies = tasks.register('extractGtceuEmbeddedDependencies', Copy) {
    outputs.upToDateWhen { false }
    from({ zipTree(configurations.gtceuEmbedded.singleFile) }) {
        include 'META-INF/jarjar/ldlib-forge-*.jar'
        include 'META-INF/jarjar/Registrate-*.jar'
        // MixinExtras is jar-jarred by GTCEu (nested inside its Forge wrapper
        // jar) and self-registers at runtime, so our mixins may use its
        // injection helpers without bundling another copy. Extract the inner
        // core jar as the compile classpath entry.
        include 'META-INF/jarjar/mixinextras-forge-*.jar'
        eachFile { details -> details.path = details.name }
        includeEmptyDirs = false
    }
    from({ zipTree(zipTree(configurations.gtceuEmbedded.singleFile)
            .matching { include 'META-INF/jarjar/mixinextras-forge-*.jar' }.singleFile) }) {
        include 'META-INF/jars/MixinExtras-*.jar'
        eachFile { details -> details.path = details.name }
        includeEmptyDirs = false
    }
    into embeddedDependencyDir
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // MixinGradle wires the refmap for our mixin config; the annotation
    // processor itself must be declared explicitly.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // MixinExtras on the processor path lets the Mixin AP see (and refmap)
    // handler methods that use its injection annotations.
    annotationProcessor files(embeddedDependencyDir.map { it.file('MixinExtras-0.5.3.jar') })

    // GregTech CEu Modern is a required common dependency. The full artifact
    // contains the libraries that GTCEu publishes as Jar-in-Jar dependencies.
    implementation fg.deobf("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}")
    gtceuEmbedded("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}") {
        transitive = false
    }

    // GTCEu embeds LDLib at runtime but does not expose it transitively to
    // addons. Extract its exact embedded copy for the addon compile classpath.
    compileOnly files(embeddedDependencyDir.map { it.file("ldlib-forge-${minecraft_version}-1.0.40.b.jar") })
    compileOnly files(embeddedDependencyDir.map { it.file('Registrate-MC1.20-1.3.11.jar') })
    compileOnly files(embeddedDependencyDir.map { it.file('MixinExtras-0.5.3.jar') })

    // The mod is required on dedicated servers too, so development server
    // runs must be able to boot. Client-only dev aids (EMI, JECh, Modern UI)
    // crash a dedicated server during mod construction; mount them only when
    // the invocation targets a client run. Jade has a common side and stays
    // mounted everywhere.
    def mountClientDevAids = gradle.startParameter.taskNames.any { it.toLowerCase().contains('client') }

    // EMI is only a development runtime aid for browsing content in test clients.
    // The API is compile-only so GSEEmiPlugin can hide the legacy upstream steam
    // input hatch from the viewer index; EMI itself is never required at runtime
    // and stays mounted only in client dev runs.
    compileOnly fg.deobf("dev.emi:emi-forge:${emi_version}:api")
    if (mountClientDevAids) {
        runtimeOnly fg.deobf("dev.emi:emi-forge:${emi_version}")
    }

    // Jade is a development runtime aid for inspecting machines in client runs.
    // It remains optional for published builds and is not declared in mods.toml.
    jadeApi("curse.maven:jade-324717:${jade_file_id}") { transitive = false }
    compileOnly files(configurations.jadeApi)
    runtimeOnly(fg.deobf("curse.maven:jade-324717:${jade_file_id}")) { transitive = false }

    // JECh adds Chinese pinyin matching to search fields in the development client.
    // It is client-only tooling and is not included in published artifacts.
    if (mountClientDevAids) {
        runtimeOnly(fg.deobf("curse.maven:just-enough-characters-250702:${jech_file_id}")) {
            transitive = false
        }
    }

    // Sophisticated Backpacks / Storage plus their prerequisites (Puzzles Lib,
    // Sophisticated Core) exist only so the test client can exercise the crafting
    // station against placeable backpacks and storage containers in-game. They
    // are not dependencies of the addon and are not declared in mods.toml.
    runtimeOnly(fg.deobf("curse.maven:puzzles-lib-495476:${puzzles_file_id}")) { transitive = false }
    runtimeOnly(fg.deobf("curse.maven:sophisticated-core-618298:${sophisticated_core_file_id}")) { transitive = false }
    runtimeOnly(fg.deobf("curse.maven:sophisticated-backpacks-422301:${sophisticated_backpacks_file_id}")) { transitive = false }
    runtimeOnly(fg.deobf("curse.maven:sophisticated-storage-619320:${sophisticated_storage_file_id}")) { transitive = false }

    // Modern UI re-skins vanilla and modded GUIs in the development client so
    // the crafting station screen can be checked under a global UI overhaul.
    // It is not a dependency of the addon and is not declared in mods.toml.
    // Its client bootstrap touches the window during mod construction, so it
    // is only mounted for client runs (see mountClientDevAids above).
    if (mountClientDevAids) {
        runtimeOnly(fg.deobf("curse.maven:modern-ui-352491:${modernui_file_id}")) { transitive = false }
    }

    // GTM Things mounts third-party GTCEu addon machines for cross-addon checks.
    // Its mods.toml hard-requires AE2 >= 15.4.2, and this AE2 version requires
    // GuideME >= 20.1.7. CurseMaven does not resolve these mod dependencies
    // automatically. Keep all three on every development runtime: unlike the
    // client-only aids above, they support dedicated servers, and unconditional
    // mounting also keeps ForgeGradle's generated IntelliJ launch classpath from
    // silently omitting saved-world block registries.
    runtimeOnly(fg.deobf("curse.maven:applied-energistics-2-223794:${ae2_file_id}")) { transitive = false }
    runtimeOnly(fg.deobf("curse.maven:guideme-1173950:${guideme_file_id}")) { transitive = false }
    runtimeOnly(fg.deobf("curse.maven:gtmthings-1104310:${gtmthings_file_id}")) { transitive = false }
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('compileJava')

    // The client mixins target Minecraft classes, so production needs the
    // refmap the Mixin annotation processor writes next to the compile output.
    from("${buildDir}/tmp/compileJava/compileJava-refmap.json") {
        rename { "${mod_id}.refmap.json" }
    }

    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            gtceu_version_range    : gtceu_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'      : mod_id,
                'Specification-Vendor'     : mod_authors,
                'Specification-Version'    : '1',
                'Implementation-Title'     : mod_name,
                'Implementation-Version'   : archiveVersion.get(),
                'Implementation-Vendor'    : mod_authors,
                'Implementation-Timestamp' : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'             : "${mod_id}.mixins.json"
        ])
    }

    preserveFileTimestamps = false
    reproducibleFileOrder = true
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    dependsOn extractGtceuEmbeddedDependencies
    options.encoding = 'UTF-8'
    options.release = 17
}

// The Mixin annotation processor writes the refmap as a side file that is
// not part of compileJava's cached outputs; a build-cache hit would restore
// classes without re-running the AP, so this task must never be cached.
tasks.named('compileJava').configure {
    outputs.cacheIf { false }
}

def checkLanguageKeys = tasks.register('checkLanguageKeys') {
    group = 'verification'
    description = 'Checks language parity and Jade provider configuration labels.'

    def enUsFile = file('src/generated/resources/assets/gregsteamexpansion/lang/en_us.json')
    def zhCnFile = file('src/main/resources/assets/gregsteamexpansion/lang/zh_cn.json')
    def jadeSources = fileTree('src/main/java/com/hoshino/gregsteamexpansion/integration/jade') {
        include '**/*.java'
    }
    inputs.files(enUsFile, zhCnFile, jadeSources)

    doLast {
        def enUs = new groovy.json.JsonSlurper().parse(enUsFile) as Map
        def zhCn = new groovy.json.JsonSlurper().parse(zhCnFile) as Map
        def errors = []

        def missingZh = (enUs.keySet() - zhCn.keySet()).sort()
        def extraZh = (zhCn.keySet() - enUs.keySet()).sort()
        if (!missingZh.isEmpty() || !extraZh.isEmpty()) {
            errors << "lang key mismatch: ${missingZh.size()} missing in zh_cn, ${extraZh.size()} extra in zh_cn"
            missingZh.take(20).each { errors << "missing in zh_cn: ${it}" }
            extraZh.take(20).each { errors << "extra in zh_cn: ${it}" }
        }

        def registrationPattern = java.util.regex.Pattern.compile(
                'registration\\.register\\w+\\(\\s*(\\w+)\\.INSTANCE')
        def providerTypePattern = java.util.regex.Pattern.compile(
                'private\\s+(?:enum|static\\s+(?:final\\s+)?class)\\s+(\\w+)')
        def uidPattern = java.util.regex.Pattern.compile(
                'private\\s+static\\s+final\\s+ResourceLocation\\s+UID\\s*=\\s*' +
                        'GregSteamExpansion\\.id\\("([^"]+)"\\);')
        def registeredProviders = new TreeSet<String>()
        def providerUids = [:]

        jadeSources.files.sort().each { sourceFile ->
            def source = sourceFile.getText('UTF-8')
            def registrationMatcher = registrationPattern.matcher(source)
            while (registrationMatcher.find()) {
                registeredProviders.add(registrationMatcher.group(1))
            }

            def declarations = []
            def providerMatcher = providerTypePattern.matcher(source)
            while (providerMatcher.find()) {
                declarations << [name: providerMatcher.group(1), start: providerMatcher.start(),
                                 bodyStart: providerMatcher.end()]
            }
            declarations.eachWithIndex { declaration, index ->
                int end = index + 1 < declarations.size() ? declarations[index + 1].start : source.length()
                def uidMatcher = uidPattern.matcher(source)
                uidMatcher.region(declaration.bodyStart as int, end)
                if (uidMatcher.find()) {
                    providerUids[declaration.name] = uidMatcher.group(1)
                }
            }
        }

        if (registeredProviders.isEmpty()) {
            errors << 'no Jade provider registrations were detected'
        }
        def missingUidDefinitions = (registeredProviders - providerUids.keySet()).sort()
        if (!missingUidDefinitions.isEmpty()) {
            errors << 'registered Jade providers have no literal UID definition: ' +
                    missingUidDefinitions.join(', ')
        }
        registeredProviders.findAll { providerUids.containsKey(it) }.each { provider ->
            // Groovy interpolation yields a GString, while JsonSlurper map keys
            // are Strings; normalize before containsKey so equal text matches.
            def key = "config.jade.plugin_${mod_id}.${providerUids[provider]}".toString()
            if (!enUs.containsKey(key)) {
                errors << "registered Jade provider ${provider} is missing en_us key ${key}"
            }
            if (!zhCn.containsKey(key)) {
                errors << "registered Jade provider ${provider} is missing zh_cn key ${key}"
            }
        }

        if (!errors.isEmpty()) {
            throw new GradleException('Language verification failed:\n - ' + errors.join('\n - '))
        }
        logger.lifecycle("Language keys aligned (${enUs.size()} keys); Jade config translations cover " +
                "${registeredProviders.size()} registered UIDs.")
    }
}

def assetPythonExecutable = providers.gradleProperty('assetPythonExecutable')
        .orElse(providers.environmentVariable('GSE_ASSET_PYTHON'))
        .orElse('python')

tasks.register('genAssets', Exec) {
    group = 'generation'
    description = 'Regenerates committed textures and GameTest structure assets.'
    workingDir rootDir
    environment 'PYTHONDONTWRITEBYTECODE', '1'
    inputs.files(fileTree('tools') {
        include 'gen_*.py', 'generate_assets.py', 'requirements.txt'
    })
    outputs.upToDateWhen { false }
    doFirst {
        commandLine assetPythonExecutable.get(), 'tools/generate_assets.py'
    }
}

def checkGeneratedAssets = tasks.register('checkGeneratedAssets', Exec) {
    group = 'verification'
    description = 'Generates assets in isolation and checks committed outputs byte for byte.'
    workingDir rootDir
    environment 'PYTHONDONTWRITEBYTECODE', '1'
    inputs.files(fileTree('tools') {
        include 'gen_*.py', 'generate_assets.py', 'requirements.txt'
    })
    doFirst {
        commandLine assetPythonExecutable.get(), 'tools/generate_assets.py', '--check'
    }
}

def checkDesignContracts = tasks.register('checkDesignContracts', Exec) {
    group = 'verification'
    description = 'Checks representative structure dimensions and parallel limits against design docs.'
    workingDir rootDir
    environment 'PYTHONDONTWRITEBYTECODE', '1'
    inputs.file('tools/check_design_contracts.py')
    inputs.files(fileTree('docs/design') { include '*.md' })
    inputs.files(fileTree('src/main/java/com/hoshino/gregsteamexpansion') { include '**/*.java' })
    doFirst {
        commandLine assetPythonExecutable.get(), 'tools/check_design_contracts.py'
    }
}

def checkMixinPackageBoundaries = tasks.register('checkMixinPackageBoundaries') {
    group = 'verification'
    description = 'Rejects nested or anonymous runtime classes in the protected Mixin package.'
    dependsOn tasks.named('compileJava')

    def compiledMixinPackage = layout.buildDirectory.dir(
            'classes/java/main/com/hoshino/gregsteamexpansion/mixins')
    inputs.dir(compiledMixinPackage)

    doLast {
        def nestedClasses = fileTree(compiledMixinPackage) {
            include '**/*$*.class'
        }.files.sort { it.name }
        if (!nestedClasses.isEmpty()) {
            def names = nestedClasses.collect { it.name }.join(', ')
            throw new GradleException(
                    "Mixin package contains nested/anonymous runtime classes: ${names}. " +
                    'Move runtime helpers outside com.hoshino.gregsteamexpansion.mixins; ' +
                    'Mixin rejects direct references to classes in its configured package.')
        }
    }
}

tasks.named('check').configure {
    dependsOn checkLanguageKeys, checkGeneratedAssets, checkDesignContracts, checkMixinPackageBoundaries
}
