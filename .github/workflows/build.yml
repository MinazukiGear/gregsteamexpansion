name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # build.gradle and settings.gradle pull in the ForgeGradle plugin from
      # the MinecraftForge maven; caching ~/.gradle keeps the Forge/GTCEu
      # dependency download off every run.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle', 'settings.gradle', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # build.gradle only runs compileJava with the Mixin AP when the compile
      # output is fresh; the forced re-run below avoids a stale refmap.
      - name: Compile
        run: ./gradlew --no-daemon compileJava

      # All in-game regression tests live here (see gametest/). This is the
      # only place that exercises machine behaviour, so it gates the build.
      # ForgeGradle derives the task name from the `gameTestServer` run config.
      - name: GameTest
        run: ./gradlew --no-daemon runGameTestServer

      # datagen output is committed under src/generated/resources, so a
      # drifting GSELang/recipe generator must fail the build rather than be
      # discovered later. Fails only when runData changes tracked files.
      - name: Check datagen is up to date
        run: |
          ./gradlew --no-daemon runData
          if [ -n "$(git status --porcelain src/generated)" ]; then
            echo "::error::src/generated/resources is stale; run ./gradlew runData locally and commit the result."
            git --no-pager diff --stat src/generated
            exit 1
          fi

      # The mod only ships under a newer Forge than the MDK default, so the
      # published JAR must be checked for the mixin refmap and lang parity.
      - name: Check language key parity
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path('.')
          en = json.loads((root / 'src/generated/resources/assets/gregsteamexpansion/lang/en_us.json').read_text('utf-8'))
          zh = json.loads((root / 'src/main/resources/assets/gregsteamexpansion/lang/zh_cn.json').read_text('utf-8'))
          missing = sorted(set(en) - set(zh))
          extra = sorted(set(zh) - set(en))
          if missing or extra:
              print(f'::error::lang key mismatch: {len(missing)} missing in zh_cn, {len(extra)} extra in zh_cn')
              for k in missing[:20]:
                  print('  missing:', k)
              for k in extra[:20]:
                  print('  extra:  ', k)
              sys.exit(1)
          print(f'lang keys aligned: {len(en)} keys')
          PY

      - name: Build
        run: ./gradlew --no-daemon build

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gregsteamexpansion-jar
          path: build/libs/*.jar
          if-no-files-found: error
