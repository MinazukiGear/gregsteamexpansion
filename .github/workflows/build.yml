name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
            java_arch: x64
            python_arch: x64
          - target: windows-x64
            os: windows-2025
            java_arch: x64
            python_arch: x64
          - target: windows-arm64
            os: windows-11-arm
            java_arch: aarch64
            python_arch: arm64
          - target: macos-arm64
            os: macos-15
            java_arch: aarch64
            python_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up native JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
          architecture: ${{ matrix.java_arch }}

      - name: Set up native Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          architecture: ${{ matrix.python_arch }}
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install asset generator dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle', 'settings.gradle', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ runner.arch }}-

      # Dedicated-server checks only. Client graphics, ARM drivers and Linux
      # distribution-specific native library loading require manual validation.
      - name: Complete repository gate
        run: python tools/verify.py

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: gregsteamexpansion-${{ matrix.target }}-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload verification logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ matrix.target }}-logs
          path: |
            build/verification/diagnostics/**
            build/verification/**/logs/*.log
            build/verification/**/crash-reports/*.txt
          if-no-files-found: ignore
