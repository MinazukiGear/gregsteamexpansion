# Gradle
# The local proxy resolves Mojang's library host through a TUN/Fake-IP address,
# which breaks ForgeGradle's optional startup probe. Dependency downloads still
# perform their normal HTTPS validation.
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8 -Dnet.minecraftforge.gradle.check.certs=false
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft / Forge
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
forge_version=47.4.10
forge_version_range=[47.4.10,48)
loader_version_range=[47,48)
mapping_channel=official
mapping_version=1.20.1

# Required mods
gtceu_version=7.5.3
gtceu_version_range=[7.5.3,8.0.0)

# Development client tools
emi_version=1.1.24+1.20.1
# Jade 11.13.3+forge (CurseForge file ID)
jade_file_id=8479276
# Just Enough Characters 4.6.11 for Forge 1.20.1 (CurseForge file ID)
jech_file_id=8771525

# Mod metadata
mod_id=gregsteamexpansion
mod_name=Greg Steam Expansion
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.hoshino.gregsteamexpansion
mod_authors=Hoshino
mod_description=A GregTech CEu Modern addon focused on expanding steam-era gameplay.
