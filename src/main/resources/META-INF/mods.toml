modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
# Both-side required: the difficulty gate and the network channel only hold
# when this mod is installed with a matching version on client and server.
displayTest="MATCH_VERSION"

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="gtceu"
mandatory=true
versionRange="${gtceu_version_range}"
ordering="AFTER"
side="BOTH"

# Optional together: the Ultimate Terminal is registered for save stability,
# but its recipe, creative entry and behaviour are enabled only when both mods
# are present.
[[dependencies.${mod_id}]]
modId="ae2"
mandatory=false
versionRange="[15.4.2,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="gtmthings"
mandatory=false
versionRange="[1.6.0,)"
ordering="AFTER"
side="BOTH"
